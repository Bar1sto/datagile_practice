[project]
name = "cve-tracker"
version = "0.1.0"
description = "CVE Vulnerability Tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.1",
    "httpx==0.28.1",
    "APScheduler==3.11.3",
    "python-dotenv==1.2.2",
    "concurrent-log-handler==0.9.29",
    "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest_asyncio==1.4.0",
    "ruff==0.15.18",
    "Jinja2==3.1.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]